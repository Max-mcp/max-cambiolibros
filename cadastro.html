<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="cadastro.css">

    <title>Cadastro | CambioLibros</title>
</head>

<body>

    <main>

        <section class="sessao-imagem">
            <img src="img/73590910bc3c47b3d4bf779c371eeb84.jpg" alt="Livros em uma livraria">
        </section>

        <section class="sessao-cadastro">

            <div class="area-titulo">

                <h1>
                    Cambio<span>Libros</span>
                </h1>

                <h2>
                    Haga parte de nuestra nueva Historia
                </h2>

            </div>

            <form action="#" method="post" id="form-cadastro">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Informe seu nome"
                >

                <label for="usuario">
                    Nome de usuário
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Escolha um nome de usuário"
                >

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Informe seu email"
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                >

                <label for="confirmar-senha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmar-senha"
                    placeholder="Confirme sua senha"
                >

                <div class="termos">

                    <input
                        type="checkbox"
                        id="aceitar-termos"
                    >

                    <label for="aceitar-termos">
                        Concordo com os termos de uso
                    </label>

                </div>

                <button id="btn-cadastrar">
                    Criar conta
                </button>

                
                <a id="texto-login" href="login.html">Já possui uma conta?</a>
                

            </form>

        </section>

    </main>

</body>

</html>
