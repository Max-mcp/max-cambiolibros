<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">

    <title>Login | CambioLibros</title>
</head>


<body>

    <main>

        <!-- LADO ESQUERDO - LOGIN -->

        <section class="sessao-login">

            <div class="area-titulo">

                <h1>
                    Cambio<span>Libros</span>
                </h1>

                <h2>
                    Troque livros e NÃO deixe a Historia morrer.
                </h2>

            </div>


            <form action="#" method="post" id="form-login">

                <label for="email">
                    Usuário ou Email
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="Informe seu email"
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Informe sua senha"
                >


                <div class="lembrar-senha">

                    <input
                        type="checkbox"
                        id="lembrar"
                    >

                    <label for="lembrar">
                        Lembrar senha
                    </label>

                </div>


                <button id="btn-acessar">
                    Acessar
                </button>


                <p class="texto-conta">
                    <a href="cadastro.html">Ainda não possui uma conta?</a>
                </p>

            </form>

        </section>


        <!-- LADO DIREITO - IMAGEM -->

        <section class="sessao-imagem">

            <img
                src="img/Login-image.jpg"
                alt="Livros em uma livraria"
            >

        </section>

    </main>

</body>

</html>
