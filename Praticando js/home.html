<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Praticando JS</title>
</head>
<body>
    <main>
        <h1>PRATICANDO JAVA SCRIPT</h1>
        <section>
            <h2>Trocar um nome na tela</h2>
            <input type="text" id="entrada-nome" placeholder="informe seu nome">
            <button id="btn-troca">Trocar nome</button>
            <p>Olá <b id="nome-saida">Visitante</b>!</p>
        </section>
        <section>
            <h2>Alterando a cor da caixa</h2>
            <div id="caixa">Aqui a caixa</div>
            <button id="btn_verde" class="btn">VERDE</button>
            <button id="btn_amarelo" class="btn">AMARELO</button>
            <button id="btn_azul" class="btn">AZUL</button>
        </section>
        <h2>SIMULANDO ADIÇÃO E SUBTRAÇÃO</h2>
        <section class="area_add_sub">
            <button id="btn_mais">+</button>
            <p id="valor_real">0</p>
            <button id="btn_menos">-</button>
        </section>

        <h2>Adcionando Livros</h2>
        <section class="area-livros">
            <input type="text" id="nome_livro">
            <Button id="adicionar_livro">adicionar</Button>
            <ul id="lista_livros">

                
            </ul>
        </section>
    </main>
    <script src="home.js"></script>
    
</body>
</html>
